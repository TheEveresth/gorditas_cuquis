<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>POS | Gorditas Cuquis</title>
  <link rel="icon" type="image/x-icon" href="favicon.png">
  <link rel="stylesheet" href="css/01-base.css">
  <link rel="stylesheet" href="css/02-componentes.css">
  <link rel="stylesheet" href="css/03-pantallas.css">
</head>
<body>

<header class="topbar">
  <div>
    <h1>Gorditas Cuquis</h1>
    <p>Punto de cobro</p>
  </div>

  <div style="display:flex; gap:10px;">
    <button class="btn-secondary" onclick="volverACuentas()">Volver</button>
    <button class="btn-secondary" onclick="toggleProductos()">Mostrar/Ocultar productos</button>
    <button class="btn-secondary" onclick="cerrarSesion()">Cerrar sesión</button>
  </div>
</header>

<main class="pos-layout">

  <section class="panel productos-panel">
    <div class="panel-header">
      <h2>Productos</h2>

      <div class="panel-header-acciones">
        <button class="btn-primary" onclick="abrirProductoRapido()">+ Producto rápido</button>
        <button class="btn-primary" onclick="crearPaquete()">+ Nuevo paquete</button>
      </div>
    </div>

    <h3>Categorías</h3>
    <div id="categorias" class="categorias-bar"></div>

    <h3>Paquete activo</h3>
    <div id="paquetesTabs" class="categorias-bar"></div>

    <div id="productos" class="productos-grid"></div>
  </section>

  <section class="panel carrito-panel">
    <h2>Cuenta actual</h2>

    <div class="cliente-box">
      <h3 id="infoPedido">Cuenta</h3>
      <p id="infoCliente"></p>
      <p id="infoTelefono"></p>
      <p id="infoExcepciones"></p>
      <p id="infoNotas"></p>
    </div>

    <div class="quick-actions" style="margin-bottom:12px;">
      <button class="btn-secondary" onclick="seleccionarTodoPendiente()">Seleccionar todo</button>
      <button class="btn-secondary" onclick="desmarcarTodo()">Desmarcar todo</button>
    </div>

    <div id="carrito" class="carrito-lista"></div>

    <div class="total-box">
      <span>Total seleccionado</span>
      <strong>$<span id="totalSeleccionado">0.00</span></strong>
    </div>

    <div class="total-box">
      <span>Total cuenta</span>
      <strong>$<span id="total">0.00</span></strong>
    </div>

    <div class="pago-box">
      <label>Método de pago</label>
      <select id="metodoPago">
        <option value="efectivo">Efectivo</option>
        <option value="tarjeta">Tarjeta</option>
        <option value="transferencia">Transferencia</option>
      </select>

      <label>Recibido</label>
      <input type="number" id="recibido" placeholder="0.00">

      <div class="cambio-box">
        <span>Cambio</span>
        <strong>$<span id="cambio">0.00</span></strong>
      </div>
    </div>

    <div class="acciones">
      <button class="btn-danger" onclick="desmarcarTodo()">Cancelar selección</button>
      <button class="btn-success" onclick="guardarVenta()">Cobrar seleccionado</button>
    </div>
  </section>

</main>

<div id="modalProductoRapido" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <h2>Producto rápido</h2>

    <label>Nombre</label>
    <input type="text" id="productoRapidoNombre" class="input-full" placeholder="Ej. Extra salsa">

    <label>Precio</label>
    <input type="number" id="productoRapidoPrecio" class="input-full" placeholder="0.00">

    <div class="acciones" style="margin-top:16px;">
      <button class="btn-secondary" onclick="cerrarProductoRapido()">Cancelar</button>
      <button class="btn-success" onclick="agregarProductoRapido()">Agregar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script>
<script src="js/core/conexion.js"></script>
<script src="js/core/datos.js"></script>
<script src="js/core/sesion.js"></script>
<script src="js/pantallas/pos.js"></script>

</body>
</html>
